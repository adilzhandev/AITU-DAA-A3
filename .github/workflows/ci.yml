name: Java build and smoke benchmark

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Java 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build and run JUnit tests
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Check all five algorithms against reference values
        run: java -jar target/graph-benchmark.jar --smoke
      - name: Check both bonuses and the scheduler critical path
        run: java -cp target/graph-benchmark.jar benchmark.BonusBenchmark --smoke
